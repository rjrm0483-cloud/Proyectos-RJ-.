name: Publicar Cabin Filter Guide

# Publica los sitios estáticos en GitHub Pages:
#   /            política de privacidad de Agenda Psiquiátrica Pro (index.html de main)
#   /nicaragua   Nicaragua Route Guide (proyecto activo)
#   /guia        Cabin Filter Guide (pausado; se conserva hasta que Rodrigo confirme su retiro)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener la rama de trabajo de los sitios
        uses: actions/checkout@v4
        with:
          ref: claude/autonomous-webpage-review-gn511e
          path: fuente

      - name: Obtener main (política de privacidad de la raíz)
        uses: actions/checkout@v4
        with:
          ref: main
          path: raiz

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            fuente/nicaragua-route-guide/sitio/package-lock.json
            fuente/cabin-filter-guide/sitio/package-lock.json

      - name: Nicaragua Route Guide — instalar dependencias
        run: npm ci
        working-directory: fuente/nicaragua-route-guide/sitio

      - name: Nicaragua Route Guide — validar datos y monetización
        run: node --test tests/data-validation.test.mjs tests/monetizacion.test.mjs
        working-directory: fuente/nicaragua-route-guide/sitio

      - name: Nicaragua Route Guide — compilar exportación estática
        run: npm run build
        working-directory: fuente/nicaragua-route-guide/sitio

      - name: Cabin Filter Guide — instalar dependencias
        run: npm ci
        working-directory: fuente/cabin-filter-guide/sitio

      - name: Cabin Filter Guide — validar los datos de las fichas
        run: node --test tests/data-validation.test.mjs
        working-directory: fuente/cabin-filter-guide/sitio

      - name: Cabin Filter Guide — compilar exportación estática
        run: npm run build:static
        working-directory: fuente/cabin-filter-guide/sitio

      - name: Componer el sitio (política en la raíz + /nicaragua + /guia)
        run: |
          mkdir -p _site/nicaragua _site/guia
          cp raiz/index.html _site/index.html
          cp -r fuente/nicaragua-route-guide/sitio/out/. _site/nicaragua/
          cp -r fuente/cabin-filter-guide/sitio/out/. _site/guia/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
