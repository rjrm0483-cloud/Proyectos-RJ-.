name: Verificar enlaces de fuentes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener la rama de trabajo del sitio
        uses: actions/checkout@v4
        with:
          ref: claude/autonomous-webpage-review-gn511e

      - name: Comprobar URLs de las fuentes de las rutas
        run: node nicaragua-route-guide/sitio/scripts/verificar-enlaces.mjs nicaragua-route-guide/sitio/data/routes.json
