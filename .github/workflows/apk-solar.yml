name: Generar APK de Sola FV Pro

# Arma el APK de la calculadora solar (carpeta sola-fv-pro), sin WebIntoApp
# y sin anuncios. Se lanza solo al subir cambios de la app, o a mano desde
# la pestaña Actions. El APK queda en "Artifacts" y, además, en la versión
# (Release) "apk-solar", con un enlace directo para el teléfono:
# https://github.com/rjrm0483-cloud/Proyectos-RJ-./releases/download/apk-solar/Sola-FV-Pro.apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'sola-fv-pro/**'
      - '.github/workflows/apk-solar.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sola-fv-pro
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Poner el logo como ícono
        run: |
          pip install pillow
          python3 scripts/iconos.py

      - name: Firmar siempre con la misma llave y poner la versión
        run: |
          python3 scripts/firma.py
          python3 scripts/version.py

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: sola-fv-pro/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sola-FV-Pro.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: Sola-FV-Pro-APK
          path: sola-fv-pro/Sola-FV-Pro.apk
          if-no-files-found: error

      - name: Publicar el APK con enlace directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-solar --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-solar Sola-FV-Pro.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sola FV Pro (APK)" \
            --notes "APK más reciente de la calculadora solar Sola FV Pro, sin anuncios. Descárguelo desde el teléfono e instálelo." \
            --prerelease
