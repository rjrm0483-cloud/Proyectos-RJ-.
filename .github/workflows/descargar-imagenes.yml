name: Descargar imágenes de destinos

# Descarga desde Wikimedia Commons las fotos declaradas en
# nicaragua-route-guide/sitio/data/imagenes.json (con autor y licencia) y las
# confirma en la rama de trabajo, para que la compilación sea determinista y
# el agente pueda revisarlas localmente.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener la rama de trabajo del sitio
        uses: actions/checkout@v4
        with:
          ref: claude/autonomous-webpage-review-gn511e

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar fotos y créditos desde Wikimedia Commons
        run: node scripts/descargar-imagenes.mjs
        working-directory: nicaragua-route-guide/sitio

      - name: Confirmar las fotos en la rama de trabajo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nicaragua-route-guide/sitio/public/images nicaragua-route-guide/sitio/data/imagenes.generado.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las imágenes."
          else
            git commit -m "Actualizar fotos de destinos desde Wikimedia Commons (con créditos)"
            git push origin HEAD:claude/autonomous-webpage-review-gn511e
          fi
