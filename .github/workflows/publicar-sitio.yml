name: Publicar sitio

# Publica en GitHub Pages solo la raíz: la política de privacidad de
# Agenda Psiquiátrica Pro (index.html de main). Nicaragua Route Guide fue
# eliminado el 19 de septiembre de 2026 y ya no se publica.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener main
        uses: actions/checkout@v4

      - name: Componer el sitio (solo la política de privacidad)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
