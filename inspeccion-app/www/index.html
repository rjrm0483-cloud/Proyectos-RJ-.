<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4E79">
  <title>Inspección de Vivienda</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica el tema antes de dibujar la página, para que no parpadee.
    (function () {
      var t = null;
      try { t = localStorage.getItem('tema'); } catch (e) {}
      if (t !== 'dia' && t !== 'noche') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'dia';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="barra">
    <button class="barra-marca" id="btn-inicio" aria-label="Ir al inicio">
      <img class="logo-mini" id="logo-barra" src="img/logo.png" alt="">
      <span class="barra-titulo" id="barra-titulo">Inspecciones</span>
    </button>
    <div class="barra-acciones">
      <button class="icono" id="btn-tema" aria-label="Cambiar a modo noche" title="Día / Noche">
        <svg class="ico-sol" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g></svg>
        <svg class="ico-luna" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.6 9.6 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg>
      </button>
      <button class="icono" id="btn-ajustes" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <main id="vista" tabindex="-1"></main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/db.js"></script>
  <script src="js/firma.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
